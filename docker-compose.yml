services:
  app:
    build: .
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./.env.docker:/var/www/html/.env
    depends_on:
      - db

  db:
    image: mariadb:10.11
    env_file: .env.docker
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/donnees.sql:/docker-entrypoint-initdb.d/02-donnees.sql

  phpmyadmin:
    image: phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
    depends_on:
      - db

volumes:
  db_data: